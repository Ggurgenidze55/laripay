# LariPay.ai Phase 3 — local production stack
# Usage: cp deploy/.env.production.example deploy/.env.production && docker compose -f deploy/docker-compose.yml up -d --build

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: laripay
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-laripay_dev_change_me}
      POSTGRES_DB: laripay
    volumes:
      - laripay_postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U laripay -d laripay"]
      interval: 5s
      timeout: 5s
      retries: 10

  laripay:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      DATABASE_URL: postgresql://laripay:${POSTGRES_PASSWORD:-laripay_dev_change_me}@postgres:5432/laripay?schema=public
      NODE_ENV: production
    ports:
      - "3002:3000"
    depends_on:
      postgres:
        condition: service_healthy

  # Optional HTTPS reverse proxy (uncomment + set DOMAIN in .env.production)
  # caddy:
  #   image: caddy:2-alpine
  #   restart: unless-stopped
  #   ports:
  #     - "80:80"
